<!-- MOTOR REAL ADICIONADO -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  let room = params.get('room') || document.getElementById('room')?.value || 'LOJA';
  let socket = null;
  
  function connectReal(){
    room = document.getElementById('room')?.value || params.get('room') || 'LOJA';
    if(socket) socket.disconnect();
    socket = io();
    socket.on('connect', ()=>{
      const status = document.getElementById('status');
      if(status) status.innerText = '✅ Conectado Sala '+room;
      socket.emit('create_room',{roomId:room});
      socket.emit('join_room',{roomId:room});
      console.log('Conectado sala', room);
    });
    socket.on('paired', ()=>{
      const status = document.getElementById('status');
      if(status) status.innerText = '✅ Tela + Controle Conectados Sala '+room;
    });
    // guarda globalmente
    window._realSocket = socket;
    window._realRoom = room;
  }
  
  // Tenta conectar automaticamente
  setTimeout(connectReal, 500);
  
  // Intercepta o campo room pra reconectar
  const roomInput = document.getElementById('room');
  if(roomInput){
    roomInput.addEventListener('change', connectReal);
  }
  
  // Função que realmente envia
  window.enviarReal = function(nome, presente, icone, tipo){
    room = document.getElementById('room')?.value || window._realRoom || 'LOJA';
    if(!window._realSocket){
      connectReal();
      setTimeout(()=>window.enviarReal(nome, presente, icone, tipo), 1000);
      return;
    }
    const data = {
      roomId: room,
      nome: nome || document.getElementById('nome')?.value || 'Anônimo',
      presente: presente || document.getElementById('presente')?.value || 'Rosa',
      icone: icone || document.getElementById('icone')?.value || '🌹',
      tipo: tipo || 'manual',
      timestamp: Date.now()
    };
    console.log('Enviando REAL:', data);
    window._realSocket.emit('gift_manual', data);
    if(navigator.vibrate) navigator.vibrate(50);
  };
  
  // Sobrescreve funções do modelo bonitinho se existirem
  // Tenta encontrar botões de envio rápido e adiciona envio real
  
  setTimeout(()=>{
    // Procura todos os botões que tinham onclick rápido
    document.querySelectorAll('button').forEach(btn=>{
      const txt = btn.innerText || btn.textContent;
      if(txt.includes('IMPRIMIR') || txt.includes('ENVIAR') || txt.includes('Rosa') || txt.includes('Leão') || txt.includes('Leao') || txt.includes('Coração') || txt.includes('💖')){
        btn.addEventListener('click', ()=>{
          // pega valores atuais
          const nome = document.getElementById('nome')?.value || 'Anônimo';
          const presente = document.getElementById('presente')?.value || btn.innerText.replace(/[^a-zA-Z]/g,'') || 'Rosa';
          const icone = document.getElementById('icone')?.value || '🌹';
          window.enviarReal(nome, presente, icone);
        });
      }
    });
    
    // Sobrescreve função enviar se existir no escopo global do arquivo bonito
    if(window.enviar){
      const oldEnviar = window.enviar;
      window.enviar = function(){
        try{ oldEnviar(); }catch(e){}
        const nome = document.getElementById('nome')?.value || 'Anônimo';
        const presente = document.getElementById('presente')?.value || 'Rosa';
        const icone = document.getElementById('icone')?.value || '🌹';
        window.enviarReal(nome, presente, icone);
      };
    }
    
    // Sobrescreve rapido se existir
    if(window.rapido){
      const oldRapido = window.rapido;
      window.rapido = function(p,i){
        try{ oldRapido(p,i); }catch(e){}
        window.enviarReal(null, p, i);
      };
    }
  }, 1000);
  
  window.conectar = connectReal;
})();
</script>
